{% extends "layout.html" %}

{% block content %}
<div class="container-fluid px-4" style="background-color: #f5f7fa;">
    <!-- 第一行：用户信息版块 -->
    <div class="row mb-4">
        <!-- 卡片样式美化，移除放大效果，调整背景色和边距 -->
        <div class="col-lg-2 col-md-4 col-sm-6 mb-2">
            <div class="card shadow-sm border-0" style="background-color: #17a2b8; color: white;">
                <div class="card-body text-center">
                    <h5 class="card-title">0</h5>
                    <p class="card-text">今日订单</p>
                </div>
            </div>
        </div>
        <div class="col-lg-2 col-md-4 col-sm-6 mb-2">
            <div class="card shadow-sm border-0" style="background-color: #007bff; color: white;">
                <div class="card-body text-center">
                    <h5 class="card-title">5</h5>
                    <p class="card-text">等级</p>
                </div>
            </div>
        </div>
        <div class="col-lg-2 col-md-4 col-sm-6 mb-2">
            <div class="card shadow-sm border-0" style="background-color: #6f42c1; color: white;">
                <div class="card-body text-center">
                    <h5 class="card-title">¥49.42</h5>
                    <p class="card-text">当前余额</p>
                </div>
            </div>
        </div>
        <div class="col-lg-2 col-md-4 col-sm-6 mb-2">
            <div class="card shadow-sm border-0" style="background-color: #e83e8c; color: white;">
                <div class="card-body text-center">
                    <h5 class="card-title">¥50.00</h5>
                    <p class="card-text">总充值</p>
                </div>
            </div>
        </div>
        <div class="col-lg-2 col-md-4 col-sm-6 mb-2">
            <div class="card shadow-sm border-0" style="background-color: #fd7e14; color: white;">
                <div class="card-body text-center">
                    <h5 class="card-title">¥0.00</h5>
                    <p class="card-text">本月消费</p>
                </div>
            </div>
        </div>
        <div class="col-lg-2 col-md-4 col-sm-6 mb-2">
            <div class="card shadow-sm border-0" style="background-color: #28a745; color: white;">
                <div class="card-body text-center">
                    <h5 class="card-title">0</h5>
                    <p class="card-text">本月订单</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 第二行：订单统计和历史公告 -->
    <div class="row">
        <!-- 订单统计 -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title">订单统计</h5>
                    <canvas id="orderChart" width="400" height="200"></canvas>
                </div>
            </div>
        </div>

        <!-- 历史公告 -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title">历史公告</h5>
                    <div class="historical-announcements">
                        <!-- 公告列表美化 -->
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                                <strong>2024-10-21</strong>
                                <p class="text-muted">公告内容示例...</p>
                            </li>
                            <li class="list-group-item">
                                <strong>2024-10-20</strong>
                                <p class="text-muted">公告内容示例...</p>
                            </li>
                            <li class="list-group-item">
                                <strong>2024-10-19</strong>
                                <p class="text-muted">公告内容示例...</p>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js脚本 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    var ctx = document.getElementById('orderChart').getContext('2d');
    var orderChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['10-16', '10-17', '10-18', '10-19', '10-20', '10-21', '10-22'],
            datasets: [{
                label: '订单数量',
                data: [0, 0, 0, 0, 0, 0, 0],
                borderColor: 'rgba(75, 192, 192, 1)',
                fill: false,
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
{% endblock %}
